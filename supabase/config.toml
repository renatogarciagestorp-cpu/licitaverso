# Configuração usada pela publicação automática (GitHub Actions → Supabase).
# As duas funções conferem o login por conta própria, por isso o gateway não exige JWT.
project_id = "licitaverso"

[functions.mp-checkout]
verify_jwt = false

[functions.mp-webhook]
verify_jwt = false

[functions.avisos]
verify_jwt = false

[functions.forum-aviso]
verify_jwt = false

[functions.consultoria-aviso]
verify_jwt = false
