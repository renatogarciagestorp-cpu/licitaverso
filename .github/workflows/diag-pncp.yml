name: Diagnóstico pesquisa (temporário)
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - env: { S: "${{ secrets.AVISOS_SECRET }}" }
        run: |
          for c in '{"objeto":"Serviços contínuos de limpeza, asseio e conservação predial","uf":"RJ","natureza":"Serviço contínuo"}' '{"objeto":"Aquisição de notebooks para as escolas","uf":"RJ","natureza":"Bem"}'; do
            curl -sS -m 90 -X POST https://umnhhztdqersjfrzqcea.supabase.co/functions/v1/pesquisa-mercado -H "x-avisos: $S" -H "Content-Type: application/json" -d "$c" -w "\nHTTP %{http_code} %{time_total}s\n" | python3 -c "
          import sys,json;t=sys.stdin.read();c,_,r=t.rpartition('\nHTTP');print('HTTP',r.strip())
          try:
            j=json.loads(c);print('erro:',j.get('erro'),'refs',len(j.get('referencias',[])))
            for x in j.get('referencias',[])[:6]: print(' -',x['solucao'],x['uf'],x['data'],x['orgao'][:40],x['valor_total_estimado'],len(x['itens']))
          except Exception as e: print(c[:500])"
          done
