name: Diagnóstico (temporário)
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env: { S: "${{ secrets.AVISOS_SECRET }}" }
        run: |
          python3 scripts/agente/pesquisa_mercado.py --objeto "Aquisição de notebooks para as escolas municipais" --uf RJ --natureza "Bem" | grep -A40 "PREÇOS PRATICADOS" | cut -c1-250
          for c in '{"objeto":"Serviços contínuos de limpeza, asseio e conservação predial","uf":"RJ","natureza":"Serviço contínuo"}' '{"objeto":"Aquisição de notebooks para as escolas","uf":"RJ","natureza":"Bem"}'; do
            curl -sS -m 90 -X POST https://umnhhztdqersjfrzqcea.supabase.co/functions/v1/pesquisa-mercado -H "x-avisos: $S" -H "Content-Type: application/json" -d "$c" -w "\nHTTP %{http_code} %{time_total}s\n" | python3 -c "
          import sys,json;t=sys.stdin.read();c,_,r=t.rpartition('\nHTTP');print('HTTP',r.strip())
          j=json.loads(c);print('erro:',j.get('erro'),'refs',len(j.get('referencias',[])),'precos',len(j.get('precos_praticados',[])))
          for x in j.get('precos_praticados',[])[:6]: print(' -',x['solucao'],x['catalogo'][:50],x['unidade'],x['n'],x['excluidos'],x['abrangencia'],x['minimo'],x['mediana'],x['maximo'])"
          done
