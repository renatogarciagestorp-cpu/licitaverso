name: Diagnóstico PNCP (temporário)
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 scripts/agente/pesquisa_mercado.py --objeto "Serviços contínuos de limpeza, asseio e conservação predial" --uf RJ --natureza "Serviço contínuo" | tail -45
          python3 scripts/agente/pesquisa_mercado.py --objeto "Aquisição de notebooks para as escolas municipais" --uf RJ --natureza "Bem" | tail -70
