name: Diagnóstico PNCP (temporário)
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          import sys, json; sys.path.insert(0, "scripts/agente"); import pesquisa_mercado as pm
          for q, o in [("notebook", "-data"), ("notebook", "relevancia"), ("limpeza predial", "-data"), ("limpeza predial", "relevancia")]:
              try:
                  j = pm._get("/api/search/", {"q": q, "tipos_documento": "edital", "ordenacao": o, "pagina": 1, "tam_pagina": 5, "status": "todos", "ufs": "RJ"}) or {}
              except Exception as e:
                  print(q, o, "ERRO", e); continue
              print("==", q, o, "total", j.get("total"))
              for h in j.get("items", [])[:5]:
                  print("  ", h.get("data_publicacao_pncp"), h.get("situacao_nome"), "|", (h.get("description") or "")[:110], "|", h.get("item_url"), sorted(h.keys())[:40] if q == "notebook" and o == "-data" else "")
              h = (j.get("items") or [None])[0]
              if h:
                  i = pm._ident(h); print("   ident", i)
                  try:
                      its = pm._get(f"/api/pncp/v1/orgaos/{i[0]}/compras/{i[1]}/{i[2]}/itens", {"pagina": 1, "tamanhoPagina": 100}) or []
                      print("   itens", len(its), json.dumps(its[:1], ensure_ascii=False)[:600])
                  except Exception as e:
                      print("   itens ERRO", e)
          PY
