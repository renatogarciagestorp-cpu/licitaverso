name: Acervo — juntar documentos novos ao site
# As coletas do Acervo gravam cada documento novo também em acervo-novos/<id>.json.
# Esta automação junta esses arquivos ao acervo.json e ao acervo-completo.json e limpa a pasta.
on:
  push:
    branches: [main]
    paths: ["acervo-novos/**"]
  workflow_dispatch:
concurrency:
  group: acervo-mesclar
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  mesclar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Juntar ao acervo
        run: node scripts/mesclar-acervo.mjs
      # faixa "Chegando na Biblioteca" da página inicial: refeita com o que acabou de entrar
      - name: Atualizar a faixa da página inicial
        run: python3 scripts/gerar-destaques.py
      - name: Publicar
        run: |
          git config user.name "Licitacon — acervo"
          git config user.email "actions@users.noreply.github.com"
          # o git add falha por inteiro se um dos caminhos não existir; a pasta de recusados só existe quando há recusa
          git add -A acervo.json acervo-completo.json acervo-novos inicio-destaques.json
          if [ -d acervo-recusados ]; then git add -A acervo-recusados; fi
          if git diff --cached --quiet; then
            # o script anunciou documentos novos mas nada foi gravado: é falha, não "sem mudanças"
            if grep -qE '\(([1-9][0-9]*) novos' /tmp/acervo-resumo.txt 2>/dev/null; then echo "::error::O script juntou documentos novos ($(cat /tmp/acervo-resumo.txt)), mas nada foi gravado."; exit 1; fi
            echo "Sem mudanças."; exit 0
          fi
          git commit -q -m "Atualiza acervo: $(cat /tmp/acervo-resumo.txt 2>/dev/null || echo 'documentos novos')"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin main && exit 0; sleep 5; done
          exit 1
