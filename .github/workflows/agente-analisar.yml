name: Agente — analisar documento (Claude Sonnet 5.5)

# Analisa um documento de uma contratação do PNCP e grava a análise e o parecer (Word e PDF)
# no ramo "agente-testes" (fora do site). Fase de testes: um documento por vez.
on:
  workflow_dispatch:
    inputs:
      link: { description: "Link do PNCP (ex.: https://pncp.gov.br/app/editais/06716880000183/2026/22)", required: true }
      documento: { description: "Tipo do documento", required: true, default: "edital", type: choice, options: [edital, etp, tr, riscos, planilha] }
      arquivo: { description: "Nome do arquivo (opcional; padrão: o maior PDF da contratação)", required: false, default: "" }

permissions:
  contents: write


jobs:
  analisar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Preparar
        run: |
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq poppler-utils tesseract-ocr tesseract-ocr-por libreoffice-writer-nogui fonts-liberation >/dev/null
          pip install -q python-docx matplotlib
          L="${{ inputs.link }}"
          read CNPJ ANO SEQ < <(python3 -c "import re,sys;m=re.search(r'(\d{14})/(\d{4})/(\d+)',sys.argv[1]);print(*m.groups()) if m else sys.exit('link inválido')" "$L")
          echo "PASTA=testes/pncp-$CNPJ-$ANO-$SEQ" >> "$GITHUB_ENV"
          echo "CNPJ=$CNPJ" >> "$GITHUB_ENV"; echo "ANO=$ANO" >> "$GITHUB_ENV"; echo "SEQ=$SEQ" >> "$GITHUB_ENV"
          git fetch -q origin agente-testes
          git worktree add -q /tmp/testes origin/agente-testes
      - name: Baixar do PNCP (se ainda não baixado)
        run: |
          D="/tmp/testes/$PASTA"
          if [ ! -f "$D/compra.json" ]; then
            python3 scripts/agente/baixar-pncp.py "$CNPJ" "$ANO" "$SEQ" "$D"
            cd "$D"
            for f in *.pdf; do [ -f "$f" ] && pdftotext -layout "$f" "${f%.pdf}.txt" || true; done
            for z in *.zip; do [ -f "$z" ] && mkdir -p "${z%.zip}" && unzip -qo "$z" -d "${z%.zip}" || true; done
            find . -path "./*/*.pdf" -exec sh -c 'pdftotext -layout "$1" "${1%.pdf}.txt"' _ {} \; || true
          fi
      - name: Analisar
        run: |
          erro() { echo "::error title=$1::$(tail -c 1500 /tmp/err.txt | tr '\n' ' ')"; exit 1; }
          D="/tmp/testes/$PASTA"
          PDF=$(python3 - "$D" "${{ inputs.arquivo }}" <<'PY' 2>/tmp/err.txt
          import pathlib, sys
          d, nome = pathlib.Path(sys.argv[1]), sys.argv[2].strip()
          pdfs = [p for p in d.rglob("*") if p.suffix.lower() == ".pdf" and "auto-" not in str(p)]
          if nome:
              norm = lambda t: "".join(ch for ch in t.lower() if ch.isalnum())
              alvo = norm(nome.lower().removesuffix(".pdf"))
              pdfs = [p for p in pdfs if alvo in norm(p.stem)]
          if not pdfs: sys.exit("arquivo não encontrado; disponíveis: " + ", ".join(p.name for p in d.rglob("*") if p.suffix.lower() == ".pdf"))
          print(max(pdfs, key=lambda p: p.stat().st_size))
          PY
          ) || erro "Escolha do arquivo"
          TXT="/tmp/documento.txt"; python3 scripts/agente/extrair-texto.py "$PDF" "$TXT" > /tmp/ocr.txt 2>/tmp/err.txt || erro "Leitura do PDF (nem o OCR encontrou texto)"
          [ -s /tmp/ocr.txt ] && echo "::notice title=Leitura::$(cat /tmp/ocr.txt)"
          PAGS=$(pdfinfo "$PDF" | awk '/^Pages/{print $2}')
          OUT="$D/auto-${{ inputs.documento }}-$(date +%Y%m%d-%H%M)"; mkdir -p "$OUT"
          echo "OUT=$OUT" >> "$GITHUB_ENV"
          PASTA_PNCP=""; [ "${{ inputs.documento }}" = "edital" ] && PASTA_PNCP="$D"
          python3 scripts/agente/precos-do-processo.py --texto "$TXT" ${PASTA_PNCP:+--pasta-pncp "$PASTA_PNCP"} --excluir "$CNPJ-$ANO-$SEQ" --saida "$OUT/precos.json" > /tmp/pr.txt 2>&1 || true
          echo "::notice title=Preços::$(tail -c 400 /tmp/pr.txt | tr '\n' ' ')"
          PRECOS=""; [ -f "$OUT/precos.json" ] && PRECOS="--precos $OUT/precos.json"
          python3 scripts/agente/analisar.py --doc "${{ inputs.documento }}" --texto "$TXT" --compra "$D/compra.json" $PRECOS \
            --fonte "${{ inputs.link }}" --paginas "$PAGS" --saida "$OUT/analise.json" > /tmp/out.txt 2>/tmp/err.txt || erro "Análise"
          echo "::notice title=Análise::$(cat /tmp/out.txt | tr '\n' ' ')"
          python3 scripts/agente/gerar-relatorio.py "$OUT/analise.json" "$OUT/parecer.docx" --pdf > /tmp/out.txt 2>/tmp/err.txt || erro "Relatório"
      - name: Gravar no ramo agente-testes
        run: |
          cd /tmp/testes
          git config user.name "Licitacon — agente"; git config user.email "actions@users.noreply.github.com"
          git checkout -q -B agente-testes
          git add "$PASTA"
          git commit -q -m "Agente: análise automática $PASTA (${{ inputs.documento }})"
          for i in 1 2 3 4 5; do git push -q origin agente-testes && break; git pull -q --rebase origin agente-testes; sleep $((RANDOM % 10 + 3)); done
