name: Índices de reajuste (calculadora)
on:
  schedule:
    - cron: "23 13 * * *"   # todo dia, 10h23 (Brasília)
  workflow_dispatch:
permissions: { contents: write }
concurrency: { group: indices, cancel-in-progress: false }
jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baixar séries do Banco Central
        run: python3 scripts/atualizar-indices.py indices.json
      - name: Publicar se mudou
        run: |
          if git diff --quiet -- indices.json && git ls-files --error-unmatch indices.json >/dev/null 2>&1; then echo "nada a publicar"; exit 0; fi
          git config user.name "Licitacon — índices" && git config user.email "actions@users.noreply.github.com"
          git add indices.json && git commit -q -m "Índices de reajuste atualizados"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 10; done
