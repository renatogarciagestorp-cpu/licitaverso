name: Diagnóstico — administradores (temporário)
on: { workflow_dispatch: }
jobs:
  ver:
    runs-on: ubuntu-latest
    steps:
      - env: { SUPABASE_ACCESS_TOKEN: "${{ secrets.SUPABASE_ACCESS_TOKEN }}" }
        run: |
          curl -fsS -X POST "https://api.supabase.com/v1/projects/umnhhztdqersjfrzqcea/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            --data '{"query":"select admin, left(email,2) || '"'"'***@'"'"' || split_part(email,'"'"'@'"'"',2) as email_mascarado from public.perfis order by criado_em"}' \
            | python3 -c "import json,sys; print('::notice::', json.load(sys.stdin))"
