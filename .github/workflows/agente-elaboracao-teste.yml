name: Agente — testar elaboração (ETP, TR, Projeto Básico, edital, contratação direta, riscos)

# Teste interno, com caso fictício: gera o documento, mede o custo e guarda o Word como artefato.
# Custa crédito da API (cerca de US$ 1 por documento): rodar só quando necessário.
on:
  workflow_dispatch:
    inputs:
      doc: { description: "etp, tr, projeto_basico, edital, direta ou riscos (a lei vem do campo regime do caso)", required: true, default: "etp" }
      caso: { description: "arquivo em agente/testes/elaboracao/", required: true, default: "etp-limpeza.json" }
      simular: { description: "sim = sem custo (só pesquisa de mercado e Word de exemplo); nao = chama a API", required: true, default: "sim" }
      conferencia: { description: "sim = confere e corrige o texto (custa mais); nao = só a redação", required: true, default: "sim" }

permissions: { contents: write }

jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Preparar ferramentas
        run: |
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq poppler-utils libreoffice-writer-nogui fonts-liberation >/dev/null
          pip install -q python-docx matplotlib
      - name: Elaborar
        env: { DOC: "${{ inputs.doc }}", CASO: "${{ inputs.caso }}", SIMULAR: "${{ inputs.simular }}", CONF: "${{ inputs.conferencia }}" }
        run: |
          python3 scripts/agente/elaborar.py --doc "$DOC" --respostas "agente/testes/elaboracao/$CASO" --pasta /tmp/saida $([ "$SIMULAR" = "sim" ] && echo --simular) $([ "$CONF" = "nao" ] && echo --sem-conferencia)
          python3 -c "import json;e=json.load(open('/tmp/saida/execucao.json'));print('::notice title=Custo::US$',e.get('custo_usd'),'·',e.get('segundos','-'),'s · pendências',e.get('pendencias'),'· perguntas',e.get('perguntas',0),'· alta',e.get('alta',0),'· média',e.get('media',0))"
      - name: Guardar o resultado no ramo agente-testes (caso fictício)
        if: always()
        env: { DOC: "${{ inputs.doc }}" }
        run: |
          [ -f /tmp/saida/documento.json ] || exit 0
          git fetch -q origin agente-testes && git worktree add -q /tmp/t origin/agente-testes && cd /tmp/t
          mkdir -p "elaboracao/$DOC" && cp /tmp/saida/documento.json /tmp/saida/execucao.json "elaboracao/$DOC/"
          [ -f /tmp/saida/pesquisa.json ] && cp /tmp/saida/pesquisa.json "elaboracao/$DOC/" || true
          [ -f /tmp/saida/conferencia.json ] && cp /tmp/saida/conferencia.json "elaboracao/$DOC/" || true
          [ -f /tmp/saida/documento.pdf ] && cp /tmp/saida/documento.pdf "elaboracao/$DOC/" || true
          git config user.name "Licitacon — agente" && git config user.email "actions@users.noreply.github.com"
          git checkout -q -B agente-testes && git add elaboracao && git commit -q -m "Teste de elaboração: $DOC" || exit 0
          for i in 1 2 3; do git push -q origin agente-testes && break; git pull -q --rebase origin agente-testes; done
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: elaboracao-teste, path: /tmp/saida, retention-days: 7 }
