name: Agente — fila de análises do site

# Processa as análises de documentos pedidas no site (pagas ou incluídas no Pro).
# Roda a cada 5 minutos; quando a fila está vazia, termina em segundos (sem instalar nada).
# Repositório público: o log só mostra o id da análise, nunca dados do cliente.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      teste: { description: "Teste interno: link do PNCP para analisar em nome do administrador (opcional)", required: false, default: "" }

permissions:
  contents: read

concurrency: { group: agente-fila, cancel-in-progress: false }

jobs:
  fila:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      AVISOS_SECRET: ${{ secrets.AVISOS_SECRET }}
      PROJECT_REF: umnhhztdqersjfrzqcea
    steps:
      - uses: actions/checkout@v4
      - name: Verificar a fila
        id: fila
        run: |
          if [ -n "${{ inputs.teste }}" ]; then echo "tem=true" >> "$GITHUB_OUTPUT"; else python3 scripts/agente/fila.py --verificar; fi
      - name: Preparar ferramentas
        if: steps.fila.outputs.tem == 'true'
        run: |
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq poppler-utils tesseract-ocr tesseract-ocr-por libreoffice-writer-nogui fonts-liberation unzip >/dev/null
          pip install -q python-docx matplotlib
      - name: Processar
        if: steps.fila.outputs.tem == 'true'
        env:
          TESTE: ${{ inputs.teste }}
        run: |
          if [ -n "$TESTE" ]; then python3 scripts/agente/fila.py --teste "$TESTE"; else python3 scripts/agente/fila.py; fi
