name: Teste de segurança (como um estranho)
# Tenta acessar banco, arquivos e funções sem login, só com a chave pública do site. Não imprime dados.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1"   # toda segunda-feira, 6h17 (Brasília)
permissions:
  contents: read
jobs:
  teste:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Testar como visitante sem login
        run: python3 scripts/teste-estranho.py
