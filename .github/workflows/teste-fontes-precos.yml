name: Teste — acesso às fontes de preços
# Confere se as bases públicas de preços respondem a partir do GitHub e do servidor do site (função do Supabase).
# Sem custo: só consultas a APIs públicas.
on:
  workflow_dispatch:
    inputs:
      ia: { description: "sim = testa também o filtro por IA (custo de poucos centavos)", required: true, default: "nao" }
permissions: { contents: read }
jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - name: Campos das APIs
        run: |
          H='User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/130'
          c() { curl -s -m 40 -H "$H" "$2" -o /tmp/c.json || true; python3 -c "import json,sys
          try:
            j=json.load(open('/tmp/c.json')); r=j.get('resultado') if isinstance(j,dict) else j
            r=r if isinstance(r,list) else (j.get('items') if isinstance(j,dict) else [])
            x=r[0] if r else j
            print('::notice title=$1::'+json.dumps(x,ensure_ascii=False)[:3000])
          except Exception as e: print('::notice title=$1::erro',e)"; }
          c "Campos material" "https://dadosabertos.compras.gov.br/modulo-pesquisa-preco/1_consultarMaterial?pagina=1&tamanhoPagina=5&tipo=codigoPdm&codigo=19746&estado=RJ"
          ID=$(python3 -c "import json;print(json.load(open('/tmp/c.json'))['resultado'][0]['idCompra'])" 2>/dev/null || echo 0)
          c "Campos detalhe" "https://dadosabertos.compras.gov.br/modulo-pesquisa-preco/2_consultarMaterialDetalhe?pagina=1&idCompra=$ID&codigoItemCatalogo=0"
          c "Campos detalhe2" "https://dadosabertos.compras.gov.br/modulo-pesquisa-preco/2_consultarMaterialDetalhe?pagina=1&idCompra=$ID"
          c "Campos PNCP busca" "https://pncp.gov.br/api/search/?q=papel%20sulfite&tipos_documento=edital&pagina=1&tam_pagina=3&status=todos&ufs=RJ"
          c "Campos PNCP item" "https://pncp.gov.br/api/pncp/v1/orgaos/11855524000180/compras/2026/15/itens?pagina=1&tamanhoPagina=1"
          c "Campos PNCP resultado" "https://pncp.gov.br/api/pncp/v1/orgaos/11855524000180/compras/2026/15/itens/31/resultados"
          c "Campos PNCP compra" "https://pncp.gov.br/api/consulta/v1/orgaos/11855524000180/compras/2026/15"
      - name: A partir do GitHub
        run: |
          H='User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/130'
          t() { c=$(curl -s -m 40 --max-redirs 10 -o /tmp/r -w '%{http_code}' -H "$H" -L "$2" || echo "falhou:$?"); echo "::notice title=$1::HTTP $c · $(head -c 160 /tmp/r | tr -d '\n\r' | tr -c '[:print:]' ' ')"; }
          t "Compras material" "https://dadosabertos.compras.gov.br/modulo-pesquisa-preco/1_consultarMaterial?pagina=1&tamanhoPagina=10&tipo=codigoPdm&codigo=4813"
          t "Compras servico" "https://dadosabertos.compras.gov.br/modulo-pesquisa-preco/3_consultarServico?pagina=1&tamanhoPagina=10&codigoItemCatalogo=5380"
          t "PNCP busca" "https://pncp.gov.br/api/search/?q=papel%20a4&tipos_documento=edital&pagina=1&tam_pagina=5&status=todos"
          t "PNCP consulta" "https://pncp.gov.br/api/consulta/v1/contratacoes/publicacao?dataInicial=20261001&dataFinal=20261002&codigoModalidadeContratacao=6&pagina=1&tamanhoPagina=10"
          t "SINAPI pagina" "https://www.caixa.gov.br/poder-publico/modernizacao-gestao/sinapi/Paginas/default.aspx"
          t "SICRO pagina" "https://www.gov.br/dnit/pt-br/assuntos/planejamento-e-pesquisa/custos-e-pagamentos/custos-e-pagamentos-dnit/sistemas-de-custos/sicro"
      - uses: actions/checkout@v4
      - name: A partir do servidor do site (função do Supabase)
        env: { AVISOS_SECRET: "${{ secrets.AVISOS_SECRET }}" }
        run: |
          for corpo in '{"objeto":"papel A4 sulfite","uf":"RJ","so_precos":true}' '{"acao":"teste_fontes"}'; do
            for f in pesquisa-mercado pesquisa-precos; do
              c=$(curl -s -m 150 -o /tmp/r -w '%{http_code}' -X POST "https://umnhhztdqersjfrzqcea.supabase.co/functions/v1/$f" -H "Content-Type: application/json" -H "x-avisos: $AVISOS_SECRET" -d "$corpo" || echo falhou)
              echo "::notice title=Servidor $f::HTTP $c · $(python3 scripts/resumo-teste-precos.py /tmp/r)"
            done
          done
      - name: Coleta e IA (função pesquisa-precos)
        env: { AVISOS_SECRET: "${{ secrets.AVISOS_SECRET }}", IA: "${{ inputs.ia }}" }
        run: |
          U="https://umnhhztdqersjfrzqcea.supabase.co/functions/v1/pesquisa-precos"
          chamar() { c=$(curl -s -m 150 -o /tmp/r -w '%{http_code}' -X POST "$U" -H "Content-Type: application/json" -H "x-avisos: $AVISOS_SECRET" -d "$2" || echo falhou); echo "::notice title=$1::HTTP $c · $(head -c 900 /tmp/r | tr -d '\n\r')"; }
          chamar "Catalogo" '{"acao":"catalogo","texto":"papel a4","tipo":"material"}'
          COD=$(python3 -c "import json;print(json.load(open('/tmp/r'))['itens'][0]['codigo'])" 2>/dev/null || echo 0)
          chamar "Coleta Painel" "{\"acao\":\"coletar\",\"codigo\":$COD,\"tipo\":\"material\",\"uf\":\"RJ\",\"meses\":12}"
          python3 -c "import json;j=json.load(open('/tmp/r'));r=j.get('registros',[]);print('::notice title=Painel resumo::',len(r),'registros ·',j.get('abrangencia'),'·',[ (x['preco'],x['unidade'],x['descricao'][:40]) for x in r[:5]])" || true
          python3 -c "import json;r=json.load(open('/tmp/r')).get('registros',[])[:12];json.dump({'acao':'ia_similares','descricao':'Papel sulfite A4 75 g/m2, resma com 500 folhas','unidade':'resma','registros':[{'id':x['id'],'descricao':x['descricao'],'unidade':x['unidade'],'preco':x['preco']} for x in r]},open('/tmp/ia.json','w'))" || true
          chamar "Coleta PNCP" '{"acao":"pncp","descricao":"papel sulfite A4 resma 500 folhas","uf":"RJ","meses":12}'
          if [ "$IA" = "sim" ] && [ -s /tmp/ia.json ]; then chamar "IA similares" "$(cat /tmp/ia.json)"; fi
