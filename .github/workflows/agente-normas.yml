name: Agente — atualizar base normativa

# Baixa o texto oficial das leis (Planalto) e grava agente/normas/*.json.
# Roda quando a lista de fontes ou o robô mudam, no dia 1º de cada mês e quando acionado à mão.
# Hoje o Planalto bloqueia os servidores do GitHub: a base é atualizada a partir de páginas salvas
# pelo navegador (scripts/agente/baixar-normas.py --arquivo). Fica só o acionamento manual.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agente-normas
  cancel-in-progress: false

jobs:
  baixar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Baixar e estruturar as normas
        run: python3 scripts/agente/baixar-normas.py
      - name: Gravar no repositório (só se algo mudou)
        run: |
          git config user.name "Licitacon — base normativa"
          git config user.email "actions@users.noreply.github.com"
          git add agente/normas/*.json agente/normas/_ultima-execucao.txt
          if git diff --cached --quiet; then echo "Nada mudou."; exit 0; fi
          git commit -m "Agente: base normativa atualizada a partir do texto oficial"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
